<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Request Change - SRM^NCR WebRing</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/theme.js"></script>
</head>
<body class="join-page">
    <header>
        <div class="nav-container">
            <nav class="nav-links">
                <a href="index.html">Directory</a>
                <a href="join.html">Join Ring</a>
                <a href="badge.html">Badge Gen</a>
                <a href="enquiry.html" class="active">Enquiries</a>
            </nav>
            <button class="theme-toggle" id="themeToggle" aria-label="Toggle dark/light mode">
                <!-- Sun SVG -->
                <svg class="theme-icon sun-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="5"></circle>
                    <line x1="12" y1="1" x2="12" y2="3"></line>
                    <line x1="12" y1="21" x2="12" y2="23"></line>
                    <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                    <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                    <line x1="1" y1="12" x2="3" y2="12"></line>
                    <line x1="21" y1="12" x2="23" y2="12"></line>
                    <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                    <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
                </svg>
                <!-- Moon SVG -->
                <svg class="theme-icon moon-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
                </svg>
            </button>
        </div>
    </header>

    <div class="page-container">
        <h1>Request a Change / Report Link</h1>
        
        <form id="enquiryForm">
            <label>
                Name 
                <input type="text" id="name" required placeholder="Your name">
            </label>
            
            <label>
                Email 
                <input type="email" id="email" required placeholder="Your registered email">
            </label>
            
            <label>
                Type
                <select id="type" required>
                    <option value="" disabled selected>Select a request type</option>
                    <option value="broken-link">Report Broken Link</option>
                    <option value="grad-date-correction">Graduation Date Correction</option>
                    <option value="removal">Remove Me from Ring</option>
                    <option value="badge-change">Badge Change</option>
                    <option value="other">Other Enquiry</option>
                </select>
            </label>
            
            <label>
                Details 
                <textarea id="details" required placeholder="Specify details here (e.g. Website URL that is broken, or corrected graduation date)..."></textarea>
            </label>
            
            <button type="submit">Submit Request</button>
        </form>
        
        <pre id="output" style="display: none;"></pre>
    </div>

    <footer>
        <p>&copy; 2026 SRM<sup>NCR</sup> WebRing. All rights reserved.</p>
    </footer>

    <script src="js/enquiry.js"></script>
    <script>
        // Pre-fill type from query params
        const params = new URLSearchParams(window.location.search);
        const typeParam = params.get('type');
        if (typeParam) {
            const selectEl = document.getElementById('type');
            for (let option of selectEl.options) {
                if (option.value === typeParam) {
                    option.selected = true;
                    break;
                }
            }
        }
    </script>
</body>
</html>
