<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Join - SRM^NCR WebRing</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/themes/dark.css">
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/theme.js"></script>
</head>
<body class="join-page">
    <header>
        <div class="nav-container">
            <nav class="nav-links">
                <a href="index.html">Directory</a>
                <a href="join.html" class="active">Join Ring</a>
                <a href="badge.html">Badge Gen</a>
                <a href="enquiry.html">Enquiries</a>
            </nav>
            <button class="theme-toggle" id="themeToggle" aria-label="Toggle dark/light mode">
                <!-- Sun SVG -->
                <svg class="theme-icon sun-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="5"></circle>
                    <line x1="12" y1="1" x2="12" y2="3"></line>
                    <line x1="12" y1="21" x2="12" y2="23"></line>
                    <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                    <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                    <line x1="1" y1="12" x2="3" y2="12"></line>
                    <line x1="21" y1="12" x2="23" y2="12"></line>
                    <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                    <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
                </svg>
                <!-- Moon SVG -->
                <svg class="theme-icon moon-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
                </svg>
            </button>
        </div>
    </header>

    <div class="page-container">
        <h1>Join the WebRing</h1>
        
        <form id="joinForm">
            <label>
                Name 
                <input type="text" id="name" required placeholder="e.g. Shivam Nagar">
            </label>

            <label>
                Website URL 
                <input type="url" id="website" required placeholder="https://yourname.github.io/">
            </label>

            <label>
                Program 
                <input type="text" id="program" required placeholder="e.g. B.Tech CSE">
            </label>

            <label>
                Graduation Date
                <input type="text" id="gradDate" required placeholder="YYYY-MM-DD">
            </label>

            <!-- Private Emails (sent to Cloudflare Workers KV, not stored in public repo JSON) -->
            <label>
                College Email (Private)
                <input type="email" id="collegeEmail" required placeholder="sn1234@srmist.edu.in">
            </label>

            <label>
                Personal Email (Private)
                <input type="email" id="personalEmail" required placeholder="shivam@example.com">
            </label>
            
            <label>
                Badge Image URL
                <input type="url" id="badge" required placeholder="https://yourname.github.io/badge.gif">
                <span style="font-size: 0.8rem; color: var(--text-muted); margin-top: 4px;">
                    Need a badge? Create/upload one using our <a href="badge.html" style="color: var(--accent-color);">Badge Generator</a> first.
                </span>
            </label>
            
            <label>
                Location 
                <input type="text" id="location" required placeholder="e.g. Delhi NCR">
            </label>

            <button type="submit">Submit Request</button>
        </form>

        <pre id="output" style="display: none;"></pre>
    </div>

    <footer>
        <p>&copy; 2026 SRM<sup>NCR</sup> WebRing. All rights reserved.</p>
    </footer>

    <script src="js/join.js"></script>
</body>
</html>
