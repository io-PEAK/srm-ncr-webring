<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0c4da2">
    <title>Join | SRM NCR WebRing</title>
    <link rel="icon" href="img/tree_yellow.png" type="image/png">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="subpage">
    <a href="index.html" class="skip-link">Back to ring</a>

    <main class="panel-inner">
        <a href="index.html" class="back-link">&larr; Back to ring</a>

        <h1>Join<br>the <span class="h1-accent">ring.</span></h1>
        <p>Build a portfolio site, drop our widget into your footer, and submit this form. Your entry is turned into a pull request automatically and merged once it's approved.</p>

        <section id="widget" class="widget-section">
            <h2>Your widget code</h2>
            <div class="widget-code">
                <pre><code id="widgetCode" class="language-html"></code></pre>
                <button type="button" class="widget-copy" id="widgetCopyBtn">Copy code</button>
            </div>
        </section>

        <form id="joinForm" class="join-form" novalidate>
            <label class="field-full">
                Name
                <input type="text" id="name" required>
            </label>

            <label class="field-full">
                Website URL
                <input type="url" id="website" required>
            </label>

            <label>
                Program
                <input type="text" id="program" required>
            </label>

            <label>
                Location
                <div class="join-location">
                    <input type="text" id="location" required autocomplete="off">
                    <div class="join-location-menu" id="locationMenu" hidden>
                        <div class="join-location-list" id="locationList"></div>
                        <p class="join-location-empty" id="locationEmpty" hidden>No matching city &mdash; type your own.</p>
                    </div>
                </div>
            </label>

            <label>
                Graduation Date
                <input type="text" id="gradDate" required placeholder="DD/MM/YYYY" autocomplete="off">
            </label>

            <label>
                College Email (private)
                <input type="email" id="collegeEmail" required placeholder="sn1234@srmist.edu.in">
            </label>

            <label class="field-full">
                Personal Email (private)
                <input type="email" id="personalEmail" required>
                <em>Backup contact. Never published.</em>
            </label>

            <label class="field-full">
                Badge Image
                <div class="join-badge-row">
                    <img id="badgePreview" class="join-badge-preview is-empty" alt="" aria-hidden="true">
                    <input type="file" id="badge" required accept="image/png,image/gif,image/jpeg">
                </div>
                <em>88&times;31 px badge, max 1 MB (PNG, GIF, or JPEG).</em>
            </label>

            <button type="submit" class="join-submit" id="joinSubmit">Submit request</button>
        </form>

        <div id="output" class="join-status" role="status"></div>
    </main>

    <script src="js/join.js"></script>
</body>
</html>
