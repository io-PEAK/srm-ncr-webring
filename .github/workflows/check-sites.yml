name: Check Member Sites
on:
  schedule:
    - cron: "0 6 */3 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check site reachability
        run: |
          node -e "
          const fs = require('fs');
          const members = require('./data/members.json');

          (async () => {
            for (const m of members) {
              try {
                // Fetch with timeout to prevent hanging on down sites
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 8000);
                
                const res = await fetch(m.website, { 
                  method: 'GET',
                  headers: { 'User-Agent': 'SRMNCR-Webring-Bot/1.0' },
                  signal: controller.signal
                });
                clearTimeout(timeoutId);

                if (res.ok) {
                  // Site is fine: restore and clear warning flags
                  delete m.unreachableSince;
                  delete m.hidden;
                  delete m.warningEmailSent;
                } else {
                  m.unreachableSince = m.unreachableSince || new Date().toISOString();
                  m.hidden = true;
                }
              } catch (e) {
                m.unreachableSince = m.unreachableSince || new Date().toISOString();
                m.hidden = true;
              }
            }

            fs.writeFileSync('./data/members.json', JSON.stringify(members, null, 2));
          })();
          "

      - name: Commit changes if any
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/members.json
          git diff --staged --quiet || git commit -m "chore: update site health status (3-day check)"
          git push
