name: Remove Graduated Members
on:
  schedule:
    - cron: "0 0 * * *" # runs daily at midnight UTC
  workflow_dispatch: # lets you manually trigger it too, for testing

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Remove members past grace period
        run: |
          node -e "
          const fs = require('fs');
          const members = require('./data/members.json');

          const now = new Date();
          const cutoffDays = 30; // 1 month grace period

          const remaining = members.filter(m => {
            const gradDate = new Date(m.gradDate);
            const graceEnd = new Date(gradDate);
            graceEnd.setDate(graceEnd.getDate() + cutoffDays);
            return now <= graceEnd;
          });

          if (remaining.length !== members.length) {
            fs.writeFileSync('./data/members.json', JSON.stringify(remaining, null, 2));
            console.log('Removed ' + (members.length - remaining.length) + ' graduated member(s)');
          } else {
            console.log('No members to remove');
          }
          "

      - name: Commit changes if any
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/members.json
          git diff --staged --quiet || git commit -m "chore: remove graduated members"
          git push
